<title>Folio Reader</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap">
<style>
/* Layout: a quiet reading column with a contents rail on the left; chrome stays thin so the text is the hero. */
:root {
  --bg: #fbfafc;
  --bg-raise: #ffffff;
  --fg: #1d1a26;
  --fg-soft: #4a4557;
  --muted: #7d778a;
  --rule: #e6e2ec;
  --accent: #a3346e;
  --accent-soft: #f6e6ef;
  --select: #f3d5e4;
  --shadow: 0 1px 2px rgb(29 26 38 / .06), 0 8px 28px rgb(29 26 38 / .08);
  --serif: "Newsreader", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --sans: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --fs: 19px;
  --measure: 64ch;
  --body-face: var(--serif);
  --bar-h: 56px;
  --img-mat: transparent; --img-pad: 0px; --img-r: 0px;
  /* PDF pages: the paper and ink each mood recolours them into, and the desk they sit on */
  --page: #ffffff; --ink: #1d1a26; --desk: #eeebf2;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15131b; --bg-raise: #1d1a25; --fg: #e8e3ee; --fg-soft: #c3bccd; --muted: #8e879a;
    --rule: #2e2a38; --accent: #f08bbe; --accent-soft: #3a2232; --select: #5a2b45; --img-mat: #f5f3f8; --img-pad: 4px; --img-r: 6px;
    --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 10px 30px rgb(0 0 0 / .45);
    --page: #201c29; --ink: #e3dde9; --desk: #100e15;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15131b; --bg-raise: #1d1a25; --fg: #e8e3ee; --fg-soft: #c3bccd; --muted: #8e879a;
  --rule: #2e2a38; --accent: #f08bbe; --accent-soft: #3a2232; --select: #5a2b45; --img-mat: #f5f3f8; --img-pad: 4px; --img-r: 6px;
  --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 10px 30px rgb(0 0 0 / .45);
  --page: #201c29; --ink: #e3dde9; --desk: #100e15;
  color-scheme: dark;
}
/* Moods the reader picks override the host theme */
html:root[data-mood="paper"] {
  --bg: #fbfafc; --bg-raise: #ffffff; --fg: #1d1a26; --fg-soft: #4a4557; --muted: #7d778a;
  --rule: #e6e2ec; --accent: #a3346e; --accent-soft: #f6e6ef; --select: #f3d5e4;
  --shadow: 0 1px 2px rgb(29 26 38 / .06), 0 8px 28px rgb(29 26 38 / .08);
  color-scheme: light; --img-mat: transparent; --img-pad: 0px; --img-r: 0px;
  --page: #ffffff; --ink: #1d1a26; --desk: #eeebf2;
}
html:root[data-mood="mist"] {
  --bg: #edf1ec; --bg-raise: #f6f8f5; --fg: #1c2620; --fg-soft: #3e4b43; --muted: #6c7a71;
  --rule: #d5ddd5; --accent: #2b6a55; --accent-soft: #dbe8e0; --select: #c7dfd1; --img-mat: transparent; --img-pad: 0px; --img-r: 0px;
  --shadow: 0 1px 2px rgb(28 38 32 / .06), 0 8px 28px rgb(28 38 32 / .08);
  --page: #f6f8f5; --ink: #1c2620; --desk: #e1e7e0;
  color-scheme: light;
}
html:root[data-mood="night"] {
  --bg: #15131b; --bg-raise: #1d1a25; --fg: #e8e3ee; --fg-soft: #c3bccd; --muted: #8e879a;
  --rule: #2e2a38; --accent: #f08bbe; --accent-soft: #3a2232; --select: #5a2b45; --img-mat: #f5f3f8; --img-pad: 4px; --img-r: 6px;
  --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 10px 30px rgb(0 0 0 / .45);
  --page: #201c29; --ink: #e3dde9; --desk: #100e15;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--bar-h) + 24px); }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--sans); font-size: 14px;
  transition: background-color .35s ease, color .35s ease;
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--select); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 40; background: var(--bg);
}

/* ---------- Top bar ---------- */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  height: var(--bar-h);
  display: flex; align-items: center; gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: saturate(1.4) blur(14px);
  -webkit-backdrop-filter: saturate(1.4) blur(14px);
  border-bottom: 1px solid var(--rule);
  transition: opacity .3s ease, transform .3s ease, background-color .35s ease;
}
.brand {
  display: flex; align-items: baseline; gap: 10px; min-width: 0; flex: 1;
}
.wordmark {
  font-family: var(--serif); font-style: italic; font-weight: 500;
  font-size: 23px; letter-spacing: -.01em; color: var(--fg);
  font-variation-settings: "opsz" 72;
}
.wordmark b { color: var(--accent); font-weight: 500; }
.docname {
  color: var(--muted); font-size: 13px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
}
.docname::before { content: "/"; margin-right: 10px; color: var(--rule); }
.tools { display: flex; align-items: center; gap: 4px; }
.icon-btn {
  height: 36px; min-width: 36px; padding: 0 10px;
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  border: 0; background: transparent; border-radius: 9px; cursor: pointer;
  color: var(--fg-soft); font-size: 13px; font-weight: 500;
  transition: background-color .15s ease, color .15s ease;
}
.icon-btn:hover { background: var(--accent-soft); color: var(--fg); }
.icon-btn[aria-pressed="true"] { color: var(--accent); }
.icon-btn svg { width: 18px; height: 18px; flex: none; }
.open-btn {
  background: var(--fg); color: var(--bg); padding: 0 14px 0 12px; margin-left: 6px;
}
.open-btn:hover { background: var(--accent); color: var(--bg); }
.sep { width: 1px; height: 22px; background: var(--rule); margin: 0 4px; }

/* progress */
.progress {
  position: absolute; left: 0; bottom: -1px; height: 2px; width: 100%;
  transform-origin: 0 50%; transform: scaleX(0);
  background: var(--accent);
}

/* ---------- Popover (type settings) ---------- */
.pop {
  position: absolute; top: calc(var(--bar-h) - 4px);
  right: max(16px, env(safe-area-inset-right, 0px));
  width: 290px; max-width: calc(100vw - 32px);
  background: var(--bg-raise); border: 1px solid var(--rule); border-radius: 14px;
  box-shadow: var(--shadow); padding: 16px; display: grid; gap: 16px;
  font-size: 13px;
}
.pop h3 {
  margin: 0 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .09em;
  text-transform: uppercase; color: var(--muted);
}
.seg {
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px;
  background: var(--bg); border: 1px solid var(--rule); border-radius: 10px; padding: 3px;
}
.seg button {
  border: 0; background: transparent; border-radius: 7px; padding: 7px 6px; cursor: pointer;
  color: var(--fg-soft); font-weight: 500;
}
.seg button[aria-pressed="true"] { background: var(--bg-raise); color: var(--fg); box-shadow: var(--shadow); }
.mood-swatch {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.mood-swatch i {
  width: 28px; height: 28px; border-radius: 50%; display: block;
  border: 1px solid rgb(127 127 127 / .35);
  font-style: normal; font-family: var(--serif); font-size: 14px; line-height: 26px; text-align: center;
}
.size-row { display: flex; align-items: center; gap: 10px; }
.size-row button {
  width: 38px; height: 34px; border: 1px solid var(--rule); background: var(--bg);
  border-radius: 9px; cursor: pointer; font-family: var(--serif);
}
.size-row button:hover { border-color: var(--accent); }
.size-row .small { font-size: 14px; } .size-row .big { font-size: 20px; }
.size-row output { flex: 1; text-align: center; font-variant-numeric: tabular-nums; color: var(--fg-soft); }

/* ---------- Layout ---------- */
.shell {
  display: grid; grid-template-columns: 270px minmax(0, 1fr);
  gap: 0;
}
.rail {
  position: sticky; top: calc(var(--bar-h) + env(safe-area-inset-top, 0px));
  align-self: start;
  height: calc(100vh - var(--bar-h) - env(safe-area-inset-top, 0px));
  overflow-y: auto; overscroll-behavior: contain;
  padding-block: 36px 40px;
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: 16px;
  transition: opacity .3s ease;
}
.rail h2 {
  margin: 0 0 14px; font-size: 11px; font-weight: 600; letter-spacing: .1em;
  text-transform: uppercase; color: var(--muted);
}
.toc { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.toc a {
  display: block; padding: 6px 10px; border-radius: 8px;
  color: var(--fg-soft); text-decoration: none; line-height: 1.35; font-size: 13.5px;
  border-left: 2px solid transparent;
  transition: color .15s ease, background-color .15s ease;
}
.toc a:hover { background: var(--accent-soft); color: var(--fg); }
.toc a.active { color: var(--accent); border-left-color: var(--accent); border-radius: 0 8px 8px 0; font-weight: 600; }
.toc .l2 a { padding-left: 22px; }
.toc .l3 a, .toc .l4 a, .toc .l5 a, .toc .l6 a { padding-left: 34px; font-size: 13px; color: var(--muted); }
.toc-empty { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 0; }
.rail-note { margin: 14px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }

main {
  min-width: 0;
  padding-block: 56px 120px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.column {
  max-width: var(--measure); margin: 0 auto;
  font-size: var(--fs);
}

/* Document header */
.meta {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px;
  font-family: var(--sans); font-size: 12px; color: var(--muted);
  letter-spacing: .02em; margin-bottom: 2.2em;
  font-variant-numeric: tabular-nums;
}
.meta .chip {
  text-transform: uppercase; letter-spacing: .1em; font-weight: 600; font-size: 11px;
  color: var(--accent); background: var(--accent-soft);
  padding: 4px 9px; border-radius: 999px;
}
.meta span + span:not(.chip)::before { content: "·"; margin-right: 14px; color: var(--rule); }
.meta .chip + span::before { content: none; }

/* ---------- The document itself ---------- */
.doc {
  font-family: var(--body-face);
  font-size: 1em; line-height: 1.68; color: var(--fg);
  font-variation-settings: "opsz" 16;
  hyphens: auto; -webkit-hyphens: auto;
  overflow-wrap: break-word;
  font-kerning: normal; font-variant-ligatures: common-ligatures;
}
.doc.is-sans { font-variation-settings: normal; letter-spacing: -.003em; line-height: 1.62; }
.doc > :first-child { margin-top: 0; }
.doc p { margin: 0 0 1.05em; }
.doc h1, .doc h2, .doc h3, .doc h4, .doc h5, .doc h6 {
  font-family: var(--serif); color: var(--fg);
  text-wrap: balance; hyphens: manual; line-height: 1.18;
  font-variation-settings: "opsz" 60;
  scroll-margin-top: calc(var(--bar-h) + 28px);
}
.doc h1 { font-size: 2.05em; font-weight: 500; letter-spacing: -.018em; margin: 1.9em 0 .55em; }
.doc h2 { font-size: 1.5em;  font-weight: 500; letter-spacing: -.012em; margin: 1.8em 0 .5em; }
.doc h3 { font-size: 1.2em;  font-weight: 600; margin: 1.6em 0 .45em; }
.doc h4 { font-size: 1.05em; font-weight: 600; margin: 1.5em 0 .4em; }
.doc h5, .doc h6 {
  font-family: var(--sans); font-size: .74em; font-weight: 600; letter-spacing: .1em;
  text-transform: uppercase; color: var(--muted); margin: 1.6em 0 .5em;
}
.doc h1.doc-title {
  font-size: clamp(2.2em, 6vw, 3.1em); font-weight: 400; letter-spacing: -.028em; line-height: 1.04;
  margin: 0 0 .3em; font-variation-settings: "opsz" 72;
}
.doc .doc-subtitle {
  font-family: var(--serif); font-style: italic; font-size: 1.22em; line-height: 1.4;
  color: var(--fg-soft); margin: 0 0 2.2em; text-wrap: balance;
  font-variation-settings: "opsz" 36;
}
.doc .doc-title + .doc-subtitle { padding-bottom: 1.6em; border-bottom: 1px solid var(--rule); }
.doc .doc-title + p:not(.doc-subtitle) { margin-top: 1.4em; }
.doc strong { font-weight: 650; }
.doc em { font-style: italic; }
.doc u { text-decoration-thickness: .06em; text-underline-offset: .18em; }
.doc a {
  color: var(--accent); text-decoration: underline;
  text-decoration-color: color-mix(in srgb, var(--accent) 40%, transparent);
  text-decoration-thickness: .07em; text-underline-offset: .2em;
  overflow-wrap: anywhere;
  transition: text-decoration-color .15s ease;
}
.doc a:hover { text-decoration-color: var(--accent); }
.doc ul, .doc ol { margin: 0 0 1.1em; padding-left: 1.5em; }
.doc li { margin: .3em 0; padding-left: .25em; }
.doc li > p { margin: 0; }
.doc ul li::marker { color: var(--accent); }
.doc ol li::marker { color: var(--accent); font-family: var(--sans); font-size: .82em; font-weight: 600; font-variant-numeric: tabular-nums; }
.doc blockquote {
  margin: 1.8em 0; padding: 0 0 0 1.2em;
  border-left: 2px solid var(--accent);
  font-style: italic; color: var(--fg-soft);
}
.doc blockquote.pull {
  border-left: 0; padding: .4em 0; margin: 2em 0;
  font-size: 1.32em; line-height: 1.38; text-align: left; color: var(--fg);
  font-variation-settings: "opsz" 48; text-wrap: balance;
}
.doc blockquote.pull::before {
  content: "\201C"; display: block; font-size: 2.6em; line-height: .6; height: .38em;
  color: var(--accent); font-style: normal;
}
.doc blockquote p:last-child { margin-bottom: 0; }
.doc img { max-width: 100%; height: auto; vertical-align: middle; background: var(--img-mat); padding: var(--img-pad); border-radius: var(--img-r); }
.doc img.sized { display: inline-block; }
.doc .crop { display: inline-block; overflow: hidden; max-width: 100%; vertical-align: middle; background: var(--img-mat); border-radius: var(--img-r); outline: var(--img-pad) solid var(--img-mat); outline-offset: 0; margin: var(--img-pad); }
.doc .crop img { display: block; max-width: none; height: auto; padding: 0; border-radius: 0; background: none; object-fit: fill; }
.doc p.pic { text-align: center; margin: 1.6em 0; }
.doc hr { border: 0; height: 1px; background: var(--rule); margin: 2.4em auto; width: 40%; }
.doc sup, .doc sub { font-size: .7em; line-height: 0; }
.doc sup a { text-decoration: none; font-family: var(--sans); font-weight: 600; padding: 0 .1em; }
.doc code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: .86em; background: var(--accent-soft); padding: .1em .35em; border-radius: 4px; }

.table-wrap {
  overflow-x: auto; margin: 1.8em 0 2em;
  border-top: 1px solid var(--fg); border-bottom: 1px solid var(--fg);
}
.doc table {
  border-collapse: collapse; width: 100%; min-width: 100%;
  font-family: var(--sans); font-size: .8em; line-height: 1.45;
  font-variant-numeric: tabular-nums; hyphens: manual;
}
.doc td, .doc th { padding: .7em .9em; vertical-align: top; text-align: left; border-bottom: 1px solid var(--rule); }
.doc tr:last-child td { border-bottom: 0; }
.doc tr:first-child td, .doc th {
  font-weight: 600; font-size: .86em; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
  border-bottom: 1px solid var(--fg);
}
.doc td p, .doc th p { margin: 0; }
.doc td p + p { margin-top: .4em; }

/* footnotes (mammoth renders them as an ordered list at the end) */
.doc ol.notes, .doc > ol:last-child:has(li[id^="footnote"]), .doc > ol:last-child:has(li[id^="endnote"]) {
  margin-top: 3em; padding-top: 1.4em; border-top: 1px solid var(--rule);
  font-size: .84em; color: var(--fg-soft);
}
.doc li:target, .doc .flash { animation: flash 1.6s ease; }
@keyframes flash { 0%, 30% { background: var(--accent-soft); } 100% { background: transparent; } }

.doc .pseudo-head { scroll-margin-top: calc(var(--bar-h) + 28px); }

.endmark {
  display: flex; justify-content: center; margin-top: 3.2em; color: var(--accent);
  font-family: var(--serif); font-size: 1.1em; letter-spacing: .6em; opacity: .7;
}

/* ---------- Drop overlay ---------- */
.drop {
  position: fixed; inset: 0; z-index: 60;
  display: grid; place-items: center;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  padding: 24px;
}
.drop-card {
  width: min(520px, 100%); aspect-ratio: 4 / 3; max-width: 100%;
  border: 2px dashed var(--accent); border-radius: 22px;
  display: grid; place-content: center; gap: 10px; text-align: center;
  background: var(--bg-raise); box-shadow: var(--shadow);
}
.drop-card strong { font-family: var(--serif); font-weight: 400; font-style: italic; font-size: 34px; color: var(--fg); }
.drop-card span { color: var(--muted); }

/* toast */
.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 70;
  background: var(--fg); color: var(--bg); padding: 12px 18px; border-radius: 12px;
  box-shadow: var(--shadow); font-size: 13.5px; max-width: calc(100vw - 32px); line-height: 1.45;
}

/* loading */
.loading .doc { opacity: .35; transition: opacity .2s; }

/* ---------- Focus mode ---------- */
body.focus .rail { opacity: 0; pointer-events: none; }
body.focus .bar { opacity: 0; }
body.focus .bar:hover, body.focus .bar:focus-within { opacity: 1; }

/* ---------- Narrow screens ---------- */
.rail-toggle { display: none; }
.scrim { display: none; }
@media (max-width: 980px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail {
    position: fixed; z-index: 50; left: 0; top: 0; bottom: 0; height: auto;
    width: min(320px, 86vw);
    padding-top: calc(28px + env(safe-area-inset-top, 0px));
    background: var(--bg-raise); box-shadow: var(--shadow);
    transform: translateX(-102%); transition: transform .3s cubic-bezier(.2,.8,.2,1);
  }
  body.rail-open .rail { transform: none; }
  body.rail-open .scrim { display: block; position: fixed; inset: 0; z-index: 45; background: rgb(0 0 0 / .25); }
  .rail-toggle { display: inline-flex; }
  body.focus .rail { opacity: 1; }
}
@media (max-width: 640px) {
  :root { --bar-h: 52px; }
  .docname, .btn-label, .sep { display: none; }
  main { padding-block: 32px 96px; }
  .column { font-size: min(var(--fs), 18px); }
  .open-btn { padding: 0 10px; }
}
/* ---------- Edit mode ---------- */
.docname[data-edited]::after {
  content: "Edited"; margin-left: 9px; padding: 2px 8px; border-radius: 999px;
  font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  color: var(--accent); background: var(--accent-soft);
}
.icon-btn.edit-btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.doc.editing {
  white-space: pre-wrap; tab-size: 4; hyphens: manual; -webkit-hyphens: manual;
  caret-color: var(--accent); outline: none;
}
.doc.editing:focus { outline: none; }
.doc.editing ::selection { background: color-mix(in srgb, var(--accent) 26%, transparent); }
.doc.editing [data-locked] {
  cursor: not-allowed; opacity: .62; border-radius: 6px;
  background-image: repeating-linear-gradient(135deg, transparent 0 7px, color-mix(in srgb, var(--accent) 9%, transparent) 7px 8px);
}
.doc.editing [data-atom] { cursor: default; }
.doc.editing [data-atom="img"]:hover { outline: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 2px; }
.doc.editing [data-pb="after"]::after, .doc.editing [data-pb="before"]::before, .doc.editing [data-sect]::after {
  display: block; content: "Page break"; margin: .7em 0 .2em; padding-top: .35em;
  border-top: 1px dashed var(--rule); text-align: center; white-space: normal;
  font: 600 10px/1.2 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
  pointer-events: none; user-select: none; -webkit-user-select: none;
}
.doc.editing [data-pb="before"]::before { margin: .2em 0 .7em; padding: 0 0 .35em; border-top: 0; border-bottom: 1px dashed var(--rule); }
.doc.editing [data-sect]::after { content: "Section break"; border-top-style: double; border-top-width: 3px; }

<script>
(function () {
  "use strict";
  var SAMPLE_B64 = "__SAMPLE__";

  var $ = function (id) { return document.getElementById(id); };
  var editor = null, lastExtras = null;
  var root = document.documentElement;
  var docEl = $("doc"), tocEl = $("toc"), metaEl = $("meta"), progressEl = $("progress");

  /* ---------- preferences ---------- */
  var prefs = { mood: "auto", size: 19, face: "serif", width: "64ch", pages: "themed" };
  try { var saved = JSON.parse(localStorage.getItem("folio-prefs") || "null"); if (saved) Object.assign(prefs, saved); } catch (e) {}
  function savePrefs() { try { localStorage.setItem("folio-prefs", JSON.stringify(prefs)); } catch (e) {} }

  function applyPrefs() {
    if (prefs.mood === "auto") root.removeAttribute("data-mood"); else root.setAttribute("data-mood", prefs.mood);
    root.style.setProperty("--fs", prefs.size + "px");
    root.style.setProperty("--measure", prefs.width);
    root.style.setProperty("--body-face", prefs.face === "sans" ? "var(--sans)" : "var(--serif)");
    docEl.classList.toggle("is-sans", prefs.face === "sans");
    $("sizeOut").textContent = prefs.size + " px";
    [["moodSeg", "mood"], ["faceSeg", "face"], ["widthSeg", "width"], ["pagesSeg", "pages"]].forEach(function (p) {
      $(p[0]).querySelectorAll("button").forEach(function (b) {
        b.setAttribute("aria-pressed", String(b.dataset[p[1]] === prefs[p[1]]));
      });
    });
    document.body.classList.toggle("pages-original", prefs.pages === "original");
    var m = prefs.mood === "auto" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "paper") : prefs.mood;
    $("pagesNote").textContent = prefs.pages === "original" ? "Pages look exactly as they were printed."
      : m === "night" ? "Pages turn dark with soft light ink. Photos keep their colours."
      : "Pages take on the " + m.charAt(0).toUpperCase() + m.slice(1) + " paper and ink. Photos keep their colours.";
    if (typeof applyPdfTheme === "function") applyPdfTheme();
    try { window.dispatchEvent(new CustomEvent("folio:prefs", { detail: prefs })); } catch (e) {}
  }
  function bindSeg(id, key) {
    $(id).addEventListener("click", function (e) {
      var b = e.target.closest("button"); if (!b) return;
      prefs[key] = b.dataset[key]; applyPrefs(); savePrefs(); updateProgress();
    });
  }
  bindSeg("moodSeg", "mood"); bindSeg("faceSeg", "face"); bindSeg("widthSeg", "width"); bindSeg("pagesSeg", "pages");
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () { if (prefs.mood === "auto") applyPrefs(); });
  $("sizeDown").onclick = function () { prefs.size = Math.max(14, prefs.size - 1); applyPrefs(); savePrefs(); };
  $("sizeUp").onclick = function () { prefs.size = Math.min(28, prefs.size + 1); applyPrefs(); savePrefs(); };
  applyPrefs();

  /* popover */
  var pop = $("pop"), typeBtn = $("typeBtn");
  function setPop(open) { pop.hidden = !open; typeBtn.setAttribute("aria-expanded", String(open)); }
  typeBtn.onclick = function (e) { e.stopPropagation(); setPop(pop.hidden); };
  document.addEventListener("click", function (e) { if (!pop.hidden && !pop.contains(e.target)) setPop(false); });

  /* focus mode + mobile rail */
  function setFocus(on) { document.body.classList.toggle("focus", on); $("focusBtn").setAttribute("aria-pressed", String(on)); }
  $("focusBtn").onclick = function () { setFocus(!document.body.classList.contains("focus")); };
  $("railToggle").onclick = function () { document.body.classList.add("rail-open"); };
  $("scrim").onclick = function () { document.body.classList.remove("rail-open"); };

  /* toast */
  var toastTimer;
  function toast(msg, opts) {
    var t = $("toast"); t.textContent = msg; t.hidden = false;
    if (opts && opts.action) {
      var b = document.createElement("button"); b.className = "toast-act"; b.textContent = opts.action.label;
      b.onclick = function () { t.hidden = true; opts.action.run(); };
      t.appendChild(b);
    }
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, opts && opts.action ? 8000 : 5200);
  }

  /* ---------- editing ---------- */
  if (window.FolioEditor && window.FolioModel) {
    editor = FolioEditor.create({
      docEl: docEl,
      desktop: window.folioDesktop || null,
      toast: toast,
      render: function (buf, opts) { return render(buf, current.name, current.isSample, opts); },
      refreshAside: function () { buildToc(); buildMeta(current.name, lastExtras || {}, current.isSample); updateProgress(); },

      if (k === "0") { e.preventDefault(); if (pdf) pdf.setZoom(1); return; }
      if (k === "e") { e.preventDefault(); toast("PDFs are read-only in Folio. Word documents can be edited."); return; }
      if (k === "s") { e.preventDefault(); return; }
    }
    if ((e.ctrlKey || e.metaKey) && !e.altKey && e.key.toLowerCase() === "e") { e.preventDefault(); if (editor) editor.toggle(); return; }
    if ((e.ctrlKey || e.metaKey) && !e.altKey && e.key.toLowerCase() === "s") {
      e.preventDefault();
      if (editor && editor.canEdit()) editor.save(e.shiftKey ? "copy" : "auto");
      return;
    }
    if (e.target.closest("input, textarea, [contenteditable]")) return;
    if (e.key === "Escape") { setPop(false); setFocus(false); document.body.classList.remove("rail-open"); }
    if (!e.ctrlKey && !e.metaKey && !e.altKey) {
      if (e.key === "f" || e.key === "F") setFocus(!document.body.classList.contains("focus"));
      if (e.key === "+" || e.key === "=") { if (view === "pdf") { if (pdf) pdf.zoomBy(1); } else $("sizeUp").click(); }
      if (e.key === "-") { if (view === "pdf") { if (pdf) pdf.zoomBy(-1); } else $("sizeDown").click(); }
    }
  });

  /* ---------- boot with the sample ---------- */
  function b64ToBuf(b64) {
    var bin = atob(b64), len = bin.length, bytes = new Uint8Array(len);
    for (var i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
    return bytes.buffer;
  }
  window.__folio = { openBuffer: openBuffer, toast: toast, editor: editor, get pdf() { return pdf; }, get view() { return view; } };
  openBuffer(b64ToBuf(SAMPLE_B64), "Sample document", { isSample: true });
})();
