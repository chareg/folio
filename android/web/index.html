<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Folio</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="folio-base.css">
<link rel="stylesheet" href="android.css">
</head>
<body class="view-home">

<div class="bar" id="bar">
  <button class="icon-btn back-btn" id="backBtn" aria-label="Back to your library">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <div class="brand">
    <span class="wordmark">Folio<b>.</b></span>
    <span class="docname" id="docname"></span>
  </div>
  <div class="tools">
    <button class="icon-btn reading-only" id="railToggle" aria-label="Contents">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h16M4 12h10M4 17h13"/></svg>
    </button>
    <button class="icon-btn" id="typeBtn" aria-expanded="false" aria-controls="pop" aria-label="Appearance">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19 8.5 5h1L15 19M5.2 14h7.6M15.5 19l3-7.5h.6L22 19M16.5 16.5h4.6"/></svg>
    </button>
    <button class="icon-btn open-btn home-only" id="openBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
      <span>Open</span>
    </button>
    <input type="file" id="fileInput" accept=".pdf,.docx,.docm,.dotx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
  </div>
  <div class="progress" id="progress"></div>

  <div class="pop" id="pop" hidden role="dialog" aria-label="Appearance">
    <div>
      <h3>Mood</h3>
      <div class="seg" id="moodSeg">
        <button data-mood="auto" class="mood-swatch"><i style="background:linear-gradient(135deg,#fbfafc 50%,#15131b 50%)"></i>Auto</button>
        <button data-mood="paper" class="mood-swatch"><i style="background:#fbfafc;color:#a3346e">a</i>Paper</button>
        <button data-mood="mist" class="mood-swatch"><i style="background:#edf1ec;color:#2b6a55">a</i>Mist</button>
        <button data-mood="night" class="mood-swatch"><i style="background:#15131b;color:#f08bbe">a</i>Night</button>
      </div>
    </div>
    <div class="pdf-only">
      <h3>Pages</h3>
      <div class="seg" id="pagesSeg">
        <button data-pages="themed">In my mood</button>
        <button data-pages="original">As printed</button>
      </div>
      <p class="pop-note" id="pagesNote"></p>
    </div>
    <div class="docx-only">
      <h3>Text size</h3>
      <div class="size-row">
        <button class="small" id="sizeDown" aria-label="Smaller text">A</button>
        <output id="sizeOut">18 px</output>
        <button class="big" id="sizeUp" aria-label="Larger text">A</button>
      </div>
    </div>
    <div class="docx-only">
      <h3>Typeface</h3>
      <div class="seg" id="faceSeg">
        <button data-face="serif" style="font-family:var(--serif);font-size:15px">Serif</button>
        <button data-face="sans" style="font-family:var(--sans)">Sans</button>
      </div>
    </div>
    <div class="reading-only share-row">
      <button class="sheet-btn" id="shareBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.8 7.6-4.4M8.2 13.2l7.6 4.4"/></svg>
        Share this document
      </button>
    </div>
  </div>
</div>

<aside class="rail" id="rail" aria-label="Contents">
  <h2>Contents</h2>
  <form class="goto" id="gotoForm" hidden>
    <label for="gotoInput">Go to page</label>
    <input id="gotoInput" type="number" inputmode="numeric" min="1" enterkeyhint="go">
    <span id="gotoOf"></span>
  </form>
  <ol class="toc" id="toc"></ol>
  <p class="rail-note" id="tocNote" hidden></p>
</aside>
<div class="scrim" id="scrim"></div>

<!-- Library -->
<main id="home" class="home">
  <div class="home-col">
    <p class="hello" id="hello">Hello</p>
    <h1 class="home-title">Something<br>to read<span>?</span></h1>
    <button class="open-card" id="openCard">
      <span class="open-ic">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 11v6M9 14l3 3 3-3"/></svg>
      </span>
      <span class="open-txt"><strong>Open a document</strong><small>PDF or Word (.docx), from anywhere on your phone</small></span>
    </button>

    <section class="recents" id="recentsWrap" hidden>
      <h2>Recently read</h2>
      <ul class="recent-list" id="recentList"></ul>
    </section>
    <p class="home-empty" id="homeEmpty">Tip: Folio also turns up in <em>Open with</em> and <em>Share</em> menus, so you can open a PDF straight from your email or Files.</p>

    <section class="home-moods">
      <h2>Mood</h2>
      <div class="mood-row" id="moodRow">
        <button data-mood="auto"><i style="background:linear-gradient(135deg,#fbfafc 50%,#15131b 50%)"></i>Auto</button>
        <button data-mood="paper"><i style="background:#fbfafc;color:#a3346e">a</i>Paper</button>
        <button data-mood="mist"><i style="background:#edf1ec;color:#2b6a55">a</i>Mist</button>
        <button data-mood="night"><i style="background:#15131b;color:#f08bbe">a</i>Night</button>
      </div>
    </section>
  </div>
</main>

<!-- Word documents -->
<main id="docView" class="doc-view" hidden>
  <div class="column">
    <div class="meta" id="meta"></div>
    <article class="doc" id="doc" lang="en"></article>
    <div class="endmark" aria-hidden="true">· · ·</div>
  </div>
</main>

<!-- PDFs -->
<div id="pdfView" class="pdf-view" hidden>
  <div class="pdf-scroll" id="pdfScroll"><div class="pdf-pages" id="pdfPages"></div></div>
  <div class="page-pill" id="pagePill" aria-live="polite"></div>
</div>

<div class="loader" id="loader" hidden><div class="loader-card"><span class="spinner"></span><span id="loaderText">Opening…</span></div></div>
<div class="toast" id="toast" hidden role="status"></div>

<script src="vendor/jszip.min.js"></script>
<script src="vendor/mammoth.browser.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
